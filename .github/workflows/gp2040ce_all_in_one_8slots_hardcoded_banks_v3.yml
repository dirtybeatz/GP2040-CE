name: GP2040-CE All-in-One v3 (8 Web-Slots Fix + Hardcoded Banks MK11)

on:
  workflow_dispatch:
    inputs:
      board:
        description: "Board auswaehlen (oder unten custom_board fuer eigenen Ordnernamen nutzen)"
        required: true
        default: "FlatboxRev4"
        type: choice
        options:
          - FlatboxRev4
          - FlatboxRev5
          - FlatboxRev5Southpaw
          - FlatboxRev5RGB
          - Haute42
          - Pico
          - PicoFightingBoard
          - RP2040AdvancedBreakoutBoard
          - GP2040
      custom_board:
        description: "Optional: Eigener Board-Ordnername aus configs/ (z. B. FlatboxUltra, Haute42S16, G-ROLLZ)"
        required: false
        default: ""
        type: string
      web_macro_slots:
        description: "Anzahl Web-Config Makro-Slots (Standard: 8 fuer dein Backup-JSON)"
        required: false
        default: "8"
        type: string
      web_macro_inputs:
        description: "Max. Inputs pro Web-Config Makro-Slot (Standard: 24, sicher im 32 KB EEPROM)"
        required: false
        default: "24"
        type: string
      build_webui:
        description: "Web-Configurator (www) mit 8 Slots mitbauen (MUSS aktiviert sein!)"
        required: false
        default: true
        type: boolean

jobs:
  build-combined-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ziel-Board pruefen
        shell: bash
        run: |
          TARGET_BOARD="${{ inputs.custom_board || inputs.board }}"
          echo "TARGET_BOARD=$TARGET_BOARD" >> "$GITHUB_ENV"
          echo "WEB_MACRO_SLOTS=${{ inputs.web_macro_slots }}" >> "$GITHUB_ENV"
          echo "WEB_MACRO_INPUTS=${{ inputs.web_macro_inputs }}" >> "$GITHUB_ENV"
          echo "Gewaehltes Board: $TARGET_BOARD | Slots: ${{ inputs.web_macro_slots }} | Inputs: ${{ inputs.web_macro_inputs }}"
          if [ ! -d "configs/$TARGET_BOARD" ]; then
            echo "::error::Board-Ordner 'configs/$TARGET_BOARD' nicht gefunden! Verfuegbare Boards:"
            ls -1 configs/
            exit 1
          fi

      - name: ARM-Toolchain, Protobuf & Build-Abhaengigkeiten installieren
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib build-essential python3 python3-protobuf protobuf-compiler

      - name: 8 Web-Slots (input_macro + Web-UI + Protobuf + ID 143/144) & Hardcoded Banks patchen
        shell: python3 {0}
        run: |
          import os
          import re
          import sys

          TARGET_SLOTS  = int(os.environ.get("WEB_MACRO_SLOTS", "8"))
          TARGET_INPUTS = int(os.environ.get("WEB_MACRO_INPUTS", "24"))
          MACRO_7_ID    = 143
          MACRO_8_ID    = 144

          def read_text(path):
              with open(path, "r", encoding="utf-8") as f:
                  return f.read()

          def write_text(path, content):
              parent = os.path.dirname(path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(path, "w", encoding="utf-8", newline="\n") as f:
                  f.write(content)

          def walk_files(root_dir, exts):
              if not os.path.isdir(root_dir):
                  return
              for r, dirs, files in os.walk(root_dir):
                  dirs[:] = [d for d in dirs if d not in ("node_modules", "build", "dist", ".git")]
                  for fn in sorted(files):
                      if fn.endswith(exts):
                          yield os.path.join(r, fn)

          def patch_macro_enum_cpp(txt, fp):
              """Ergaenzt BUTTON_PRESS_MACRO_7 (ID 143) und BUTTON_PRESS_MACRO_8 (ID 144) in C++."""
              if "BUTTON_PRESS_MACRO_6" not in txt or "BUTTON_PRESS_MACRO_7" in txt:
                  return txt, False
              changed = False

              # 1. Einzelne switch-cases: case GpioAction::BUTTON_PRESS_MACRO_6: ... break;
              def repl_case(m):
                  nonlocal changed
                  block = m.group(0)
                  body = m.group(1)
                  if re.search(r'\b5\b', body):
                      b7 = block.replace("BUTTON_PRESS_MACRO_6", "BUTTON_PRESS_MACRO_7")
                      b7 = re.sub(r'\b5\b', '6', b7)
                      b8 = block.replace("BUTTON_PRESS_MACRO_6", "BUTTON_PRESS_MACRO_8")
                      b8 = re.sub(r'\b5\b', '7', b8)
                      changed = True
                      return block + "\n" + b7 + "\n" + b8
                  return block

              txt_new = re.sub(
                  r'[ \t]*case\s+(?:GpioAction::)?BUTTON_PRESS_MACRO_6\s*:([\s\S]*?break;)',
                  repl_case,
                  txt
              )
              if changed:
                  print(f"[OK] {fp}: switch-cases fuer MACRO_7 & MACRO_8 ergaenzt.")
                  return txt_new, True

              # 2. Range-Check: >= BUTTON_PRESS_MACRO_1 && <= BUTTON_PRESS_MACRO_6
              # ID 143/144 liegen nicht direkt hinter 39 -> explizite else-if Zweige fuer Index 6 & 7!
              range_pat = re.compile(
                  r'([ \t]*)((?:else\s+)?if\s*\(\s*([^\s()&|]+)\s*>=\s*(GpioAction::)?BUTTON_PRESS_MACRO_1\s*&&\s*\3\s*<=\s*(?:GpioAction::)?BUTTON_PRESS_MACRO_6\s*\)\s*\{)([\s\S]*?)(\n\1\})'
              )
              def repl_range(m):
                  nonlocal changed
                  indent, head, var, prefix, body, close = m.groups()
                  prefix = prefix or ""
                  sub_pat = re.compile(rf'\b{re.escape(var)}\s*-\s*(?:GpioAction::)?BUTTON_PRESS_MACRO_1\b')
                  body7 = sub_pat.sub('6', body)
                  body8 = sub_pat.sub('7', body)
                  changed = True
                  return (
                      indent + head + body + close +
                      f" else if ({var} == {prefix}BUTTON_PRESS_MACRO_7) {{" + body7 + close +
                      f" else if ({var} == {prefix}BUTTON_PRESS_MACRO_8) {{" + body8 + close
                  )

              txt_new = range_pat.sub(repl_range, txt)
              if changed:
                  print(f"[OK] {fp}: Range-Check fuer MACRO_7 (143) & MACRO_8 (144) ergaenzt.")
                  return txt_new, True

              # 3. Array/Liste mit GpioAction::BUTTON_PRESS_MACRO_6
              arr_pat = re.compile(r'([ \t]*)((?:GpioAction::)?BUTTON_PRESS_MACRO_6)(\s*,?)')
              def repl_arr(m):
                  nonlocal changed
                  indent, tok, comma = m.groups()
                  prefix = "GpioAction::" if "GpioAction::" in tok else ""
                  changed = True
                  return (
                      f"{indent}{prefix}BUTTON_PRESS_MACRO_6,\n"
                      f"{indent}{prefix}BUTTON_PRESS_MACRO_7,\n"
                      f"{indent}{prefix}BUTTON_PRESS_MACRO_8{comma}"
                  )

              txt_new = arr_pat.sub(repl_arr, txt)
              if changed:
                  print(f"[OK] {fp}: Listen-/Array-Eintraege fuer MACRO_7 & MACRO_8 ergaenzt.")
                  return txt_new, True

              return txt, False

          # ============================================================================
          # TEIL A: PROTOBUF (8 SLOTS x 24 INPUTS + ID 143 / 144)
          # ============================================================================
          print(f"=== [A] Patche Protobuf: {TARGET_SLOTS} Slots x {TARGET_INPUTS} Inputs ===")

          proto_slots_patched = False
          proto_inputs_patched = False
          for fp in walk_files("proto", (".options",)):
              txt = read_text(fp)
              orig = txt
              txt, n1 = re.subn(r'(MacroOptions\.macroList\s+max_count:)\d+', rf'\g<1>{TARGET_SLOTS}', txt)
              txt, n2 = re.subn(r'(Macro\.macroInputs\s+max_count:)\d+', rf'\g<1>{TARGET_INPUTS}', txt)
              if n1:
                  proto_slots_patched = True
              if n2:
                  proto_inputs_patched = True
              if txt != orig:
                  write_text(fp, txt)
                  print(f"[OK] {fp} aktualisiert (macroList={TARGET_SLOTS}, macroInputs={TARGET_INPUTS}).")

          if not (proto_slots_patched and proto_inputs_patched):
              print("[FEHLER] Konnte MacroOptions.macroList / Macro.macroInputs in proto/*.options nicht patchen!", file=sys.stderr)
              sys.exit(1)

          enums_patched = False
          for fp in walk_files("proto", (".proto",)):
              txt = read_text(fp)
              if "BUTTON_PRESS_MACRO_6" not in txt:
                  continue
              if "BUTTON_PRESS_MACRO_7" in txt and "BUTTON_PRESS_MACRO_8" in txt:
                  enums_patched = True
                  print(f"[INFO] {fp}: BUTTON_PRESS_MACRO_7 & _8 bereits vorhanden.")
                  continue
              m_enum = re.search(r'(enum\s+GpioAction\s*\{[\s\S]*?)(\n\s*\})', txt)
              if m_enum:
                  addition = (
                      f"\n    BUTTON_PRESS_MACRO_7 = {MACRO_7_ID};"
                      f"\n    BUTTON_PRESS_MACRO_8 = {MACRO_8_ID};"
                  )
                  txt = txt[:m_enum.start(2)] + addition + txt[m_enum.start(2):]
                  write_text(fp, txt)
                  enums_patched = True
                  print(f"[OK] {fp}: BUTTON_PRESS_MACRO_7={MACRO_7_ID}, BUTTON_PRESS_MACRO_8={MACRO_8_ID} ergaenzt.")

          if not enums_patched:
              print("[FEHLER] Konnte BUTTON_PRESS_MACRO_7/8 nicht in proto/*.proto eintragen!", file=sys.stderr)
              sys.exit(1)

          # ============================================================================
          # TEIL B: C++ FIRMWARE REPO-WEIT PATCHEN (headers/ & src/ - inkl. input_macro!)
          # ============================================================================
          print("=== [B] Patche C++ Firmware (headers/ & src/) ===")

          cpp_slots_hits = 0
          cpp_inputs_hits = 0
          cpp_enum_hits = 0

          for root_dir in ("headers", "src"):
              for fp in walk_files(root_dir, (".h", ".hpp", ".c", ".cpp")):
                  if os.path.basename(fp) == "hardcoded_macros.h":
                      continue
                  txt = read_text(fp)
                  orig = txt

                  # 1. MAX_MACRO_LIMIT (#define / constexpr / const)
                  for pat in [
                      r'(#define\s+MAX_MACRO_LIMIT\s+)\d+',
                      r'((?:static\s+)?(?:constexpr|const)\s+[\w:]+\s+MAX_MACRO_LIMIT\s*=\s*)\d+',
                  ]:
                      txt, n = re.subn(pat, rf'\g<1>{TARGET_SLOTS}', txt)
                      cpp_slots_hits += n

                  # 2. MAX_MACRO_INPUT_LIMIT (#define / constexpr / const)
                  for pat in [
                      r'(#define\s+MAX_MACRO_INPUT_LIMIT\s+)\d+',
                      r'((?:static\s+)?(?:constexpr|const)\s+[\w:]+\s+MAX_MACRO_INPUT_LIMIT\s*=\s*)\d+',
                  ]:
                      txt, n = re.subn(pat, rf'\g<1>{TARGET_INPUTS}', txt)
                      cpp_inputs_hits += n

                  # 3. Hardcodiertes macroList_count = 6 abfangen
                  txt, n_cnt = re.subn(r'(macroList_count\s*=\s*)6\b', rf'\g<1>{TARGET_SLOTS}', txt)
                  cpp_slots_hits += n_cnt

                  # 4. Arithmetische Pin-Suche (BUTTON_PRESS_MACRO_1 + i) fuer nicht-fortlaufende IDs 143/144 sichern
                  if "BUTTON_PRESS_MACRO_1" in txt and "BUTTON_PRESS_MACRO_7" not in txt:
                      arith_pat = re.compile(r'((?:GpioAction::)?BUTTON_PRESS_MACRO_1)\s*\+\s*(\w+)')
                      if arith_pat.search(txt):
                          def repl_arith(m):
                              tok, idx_var = m.groups()
                              pref = "GpioAction::" if "GpioAction::" in tok else ""
                              return f"(({idx_var}) < 6 ? ({pref}BUTTON_PRESS_MACRO_1 + ({idx_var})) : ({pref}BUTTON_PRESS_MACRO_7 + (({idx_var}) - 6)))"
                          txt = arith_pat.sub(repl_arith, txt)
                          cpp_enum_hits += 1
                          print(f"[OK] {fp}: BUTTON_PRESS_MACRO_1 + i fuer ID 143/144 abgesichert.")

                  # 5. BUTTON_PRESS_MACRO_6 -> _7 & _8
                  txt, enum_changed = patch_macro_enum_cpp(txt, fp)
                  if enum_changed:
                      cpp_enum_hits += 1

                  if txt != orig:
                      write_text(fp, txt)
                      print(f"[OK] C++ gepatcht: {fp}")

          print(f"[CHECK C++] MAX_MACRO_LIMIT hits={cpp_slots_hits}, MAX_MACRO_INPUT_LIMIT hits={cpp_inputs_hits}, MACRO_7/8 hits={cpp_enum_hits}")

          if cpp_slots_hits == 0:
              print("[FEHLER] MAX_MACRO_LIMIT wurde in headers/ & src/ NIRGENDS gefunden! Abbruch statt fehlerhaftem 6-Slot-Build.", file=sys.stderr)
              sys.exit(1)

          # ============================================================================
          # TEIL C: WEB-UI (www/src/) REPO-WEIT PATCHEN
          # ============================================================================
          print("=== [C] Patche Web-Configurator (www/src/) ===")

          www_slots_hits = 0
          www_inputs_hits = 0
          www_pins_hits = 0

          for fp in walk_files(os.path.join("www", "src"), (".ts", ".tsx", ".js", ".jsx", ".json")):
              txt = read_text(fp)
              orig = txt

              # 1. Makro-Slot-Limit Konstanten (MAX_MACRO_LIMIT, MAX_MACRO_SLOTS, MAX_MACROS)
              for pat in [
                  r'(\bMAX_MACRO_LIMIT\s*[:=]\s*)\d+',
                  r'(\bMAX_MACRO_SLOTS\s*[:=]\s*)\d+',
                  r'(\bMAX_MACROS\s*[:=]\s*)\d+',
                  r'(macroList\.length\s*<\s*)6\b',
              ]:
                  txt, n = re.subn(pat, rf'\g<1>{TARGET_SLOTS}', txt)
                  www_slots_hits += n

              # 2. Makro-Input-Limit Konstanten (MAX_MACRO_INPUT_LIMIT, MAX_MACRO_INPUTS)
              for pat in [
                  r'(\bMAX_MACRO_INPUT_LIMIT\s*[:=]\s*)\d+',
                  r'(\bMAX_MACRO_INPUTS\s*[:=]\s*)\d+',
              ]:
                  txt, n = re.subn(pat, rf'\g<1>{TARGET_INPUTS}', txt)
                  www_inputs_hits += n

              # 3. BUTTON_PRESS_MACRO_7 (143) & BUTTON_PRESS_MACRO_8 (144) in Data/Pins.ts, Locales, etc.
              if "BUTTON_PRESS_MACRO_6" in txt and "BUTTON_PRESS_MACRO_7" not in txt:
                  num_pat = re.compile(r'([ \t]*)([\'"]?BUTTON_PRESS_MACRO_6[\'"]?\s*[:=]\s*)39(\s*,?)')
                  if num_pat.search(txt):
                      def repl_num(m):
                          indent, lhs, comma = m.groups()
                          lhs7 = lhs.replace("BUTTON_PRESS_MACRO_6", "BUTTON_PRESS_MACRO_7")
                          lhs8 = lhs.replace("BUTTON_PRESS_MACRO_6", "BUTTON_PRESS_MACRO_8")
                          return (
                              f"{indent}{lhs}39,\n"
                              f"{indent}{lhs7}{MACRO_7_ID},\n"
                              f"{indent}{lhs8}{MACRO_8_ID}{comma}"
                          )
                      txt = num_pat.sub(repl_num, txt)
                      www_pins_hits += 1
                  else:
                      line_pat = re.compile(r'^([ \t]*.*BUTTON_PRESS_MACRO_6.*)$', flags=re.MULTILINE)
                      def repl_line(m):
                          line6 = m.group(1)
                          has_comma = line6.rstrip().endswith(",")
                          base6 = line6 if has_comma else (line6 + ",")
                          line7 = base6.replace("BUTTON_PRESS_MACRO_6", "BUTTON_PRESS_MACRO_7")
                          line7 = re.sub(r'(Ma[ck]ro\s*)6\b', r'\g<1>7', line7, flags=re.IGNORECASE)
                          line7 = re.sub(r'(\s)6([\'"])', r'\g<1>7\2', line7)
                          line8 = base6.replace("BUTTON_PRESS_MACRO_6", "BUTTON_PRESS_MACRO_8")
                          line8 = re.sub(r'(Ma[ck]ro\s*)6\b', r'\g<1>8', line8, flags=re.IGNORECASE)
                          line8 = re.sub(r'(\s)6([\'"])', r'\g<1>8\2', line8)
                          if not has_comma:
                              line8 = line8.rstrip(",")
                          return f"{base6}\n{line7}\n{line8}"
                      txt_new, n_l = line_pat.subn(repl_line, txt)
                      if n_l > 0:
                          txt = txt_new
                          www_pins_hits += n_l

              if txt != orig:
                  write_text(fp, txt)
                  print(f"[OK] Web-UI gepatcht: {fp}")

          print(f"[CHECK WEB-UI] slots_hits={www_slots_hits}, inputs_hits={www_inputs_hits}, pins_hits={www_pins_hits}")

          if os.path.isdir(os.path.join("www", "src")) and www_pins_hits == 0:
              print("[FEHLER] BUTTON_PRESS_MACRO_7/8 konnte in www/src/ nicht gepatcht werden!", file=sys.stderr)
              sys.exit(1)

          if os.path.isdir(os.path.join("www", "src")) and www_slots_hits == 0:
              print("[INFO] Keine statische Slot-Konstante in www/src/ gefunden (Web-UI rendert macroList evtl. dynamisch von der Firmware).")
              for fp in walk_files(os.path.join("www", "src"), (".ts", ".tsx", ".js", ".jsx")):
                  if "macro" in fp.lower():
                      print("  Gepruefte Web-Macro-Datei:", fp)

          # ============================================================================
          # TEIL D: HARDCODED MACRO BANKS (BANK 1-3, 50ms) INJIZIEREN
          # ============================================================================
          print("=== [D] Injiziere Hardcoded Macro Banks (Bank 1-3, 0 Bytes EEPROM) ===")

          header_path = os.path.join("headers", "addons", "hardcoded_macros.h")
          header_code = r"""#ifndef _HARDCODED_MACROS_H_
          #define _HARDCODED_MACROS_H_

          #include <cstddef>
          #include <cstdint>
          #include "gamepad.h"
          #include "pico/time.h"

          namespace HardcodedMacros {

          // ============================================================================
          // KONFIGURATION: TRIGGER & VERHALTEN
          // ============================================================================
          // Select (S1, GPIO 16 im kombinierten Backup) dient als:
          //   - Bank-Wechsel-Taste (On-Release: kurz antippen & loslassen)
          //   - Modifier fuer Combo 1 (Select + L1) und Combo 2 (Select + R1)
          constexpr uint32_t BANK_SWITCH_MODIFIER   = GAMEPAD_MASK_S1; // Select / Share
          constexpr uint32_t COMBO_1_BUTTON         = GAMEPAD_MASK_L1; // L1
          constexpr uint32_t COMBO_2_BUTTON         = GAMEPAD_MASK_R1; // R1

          // Verhindert auf PS4, dass Select (Share) das Share-Menue oeffnet.
          // GP2040-CE System-Hotkeys (Start+Select+... und Fn+...) bleiben voll intakt,
          // da gamepad->hotkey() VOR diesem Modul ausgefuehrt wird.
          constexpr bool SUPPRESS_SELECT_OUTPUT     = true;

          // ============================================================================
          // DATENSTRUKTUREN (liegen komplett im Flash-ROM, 0 Bytes EEPROM!)
          // ============================================================================
          struct MacroStep {
              uint32_t buttonMask;     // Bits 0..15 = Buttons, Bits 16..19 = D-Pad (U/D/L/R)
              uint32_t durationUs;     // Haltezeit in Mikrosekunden (50 ms = 50000)
              uint32_t waitDurationUs; // Pause danach in Mikrosekunden (50 ms = 50000)
          };

          struct MacroSequence {
              const char* name;
              const MacroStep* steps;
              size_t stepCount;
          };

          struct MacroBank {
              const char* name;
              MacroSequence combo1; // Select + L1
              MacroSequence combo2; // Select + R1
          };

          // ============================================================================
          // BANK 1: SCORPION (alle Timings auf runde 50 ms / 50000 us)
          // ============================================================================
          // Fatality 1 - You're Next (Left, Down, Down, B3)
          static constexpr MacroStep BANK1_COMBO1_STEPS[] = {
              { 262144U, 50000U, 50000U }, // Left
              { 131072U, 50000U, 50000U }, // Down
              { 131072U, 50000U, 50000U }, // Down
              {      4U, 50000U,     0U }, // B3 (Square)
          };

          // Fatality 2 - Chain Reaction (Down, Right, Left, B4)
          static constexpr MacroStep BANK1_COMBO2_STEPS[] = {
              { 131072U, 50000U, 50000U }, // Down
              { 524288U, 50000U, 50000U }, // Right
              { 262144U, 50000U, 50000U }, // Left
              {      8U, 50000U,     0U }, // B4 (Triangle)
          };

          // ============================================================================
          // BANK 2: SUB-ZERO (alle Timings auf runde 50 ms / 50000 us)
          // ============================================================================
          // Fatality 1 - Ice-Cutioner (Left, Right, Left, B4)
          static constexpr MacroStep BANK2_COMBO1_STEPS[] = {
              { 262144U, 50000U, 50000U }, // Left
              { 524288U, 50000U, 50000U }, // Right
              { 262144U, 50000U, 50000U }, // Left
              {      8U, 50000U,     0U }, // B4 (Triangle)
          };

          // Fatality 2 - Frozen in Time (Right, Down, Right, B2)
          static constexpr MacroStep BANK2_COMBO2_STEPS[] = {
              { 524288U, 50000U, 50000U }, // Right
              { 131072U, 50000U, 50000U }, // Down
              { 524288U, 50000U, 50000U }, // Right
              {      2U, 50000U,     0U }, // B2 (Circle)
          };

          // ============================================================================
          // BANK 3: LIU KANG (alle Timings auf runde 50 ms / 50000 us)
          // ============================================================================
          // Fatality 1 - Burn Out (Close, P1: Down, Left, Down, Right, B3)
          static constexpr MacroStep BANK3_COMBO1_STEPS[] = {
              { 131072U, 50000U, 50000U }, // Down
              { 262144U, 50000U, 50000U }, // Left
              { 131072U, 50000U, 50000U }, // Down
              { 524288U, 50000U, 50000U }, // Right
              {      4U, 50000U,     0U }, // B3 (Square)
          };

          // Fatality 2 - Belly of the Beast (Mid, P1: Left, Down, Left, Right, B4)
          static constexpr MacroStep BANK3_COMBO2_STEPS[] = {
              { 262144U, 50000U, 50000U }, // Left
              { 131072U, 50000U, 50000U }, // Down
              { 262144U, 50000U, 50000U }, // Left
              { 524288U, 50000U, 50000U }, // Right
              {      8U, 50000U,     0U }, // B4 (Triangle)
          };

          // ============================================================================
          // BANKEN-TABELLE
          // ============================================================================
          static constexpr MacroBank BANKS[] = {
              {
                  "Bank 1: Scorpion",
                  { "Fatality 1: You're Next",        BANK1_COMBO1_STEPS, sizeof(BANK1_COMBO1_STEPS) / sizeof(MacroStep) },
                  { "Fatality 2: Chain Reaction",     BANK1_COMBO2_STEPS, sizeof(BANK1_COMBO2_STEPS) / sizeof(MacroStep) }
              },
              {
                  "Bank 2: Sub-Zero",
                  { "Fatality 1: Ice-Cutioner",       BANK2_COMBO1_STEPS, sizeof(BANK2_COMBO1_STEPS) / sizeof(MacroStep) },
                  { "Fatality 2: Frozen in Time",     BANK2_COMBO2_STEPS, sizeof(BANK2_COMBO2_STEPS) / sizeof(MacroStep) }
              },
              {
                  "Bank 3: Liu Kang",
                  { "Fatality 1: Burn Out",           BANK3_COMBO1_STEPS, sizeof(BANK3_COMBO1_STEPS) / sizeof(MacroStep) },
                  { "Fatality 2: Belly of the Beast", BANK3_COMBO2_STEPS, sizeof(BANK3_COMBO2_STEPS) / sizeof(MacroStep) }
              }
          };

          static constexpr size_t NUM_BANKS = sizeof(BANKS) / sizeof(MacroBank);

          // ============================================================================
          // RUNTIME-STATUS & PLAYBACK-ENGINE
          // ============================================================================
          struct RuntimeState {
              size_t currentBank = 0;               // Startet auf Bank 1 (Index 0 = Scorpion)
              bool prevSelect = false;
              bool prevL1 = false;
              bool prevR1 = false;
              bool selectConsumed = false;          // true sobald Combo oder Start-Hotkey genutzt wurde

              bool isPlaying = false;
              const MacroSequence* activeSeq = nullptr;
              size_t stepIndex = 0;
              uint64_t stepStartUs = 0;
          };

          inline RuntimeState& state() {
              static RuntimeState instance;
              return instance;
          }

          inline size_t getCurrentBankIndex() {
              return state().currentBank;
          }

          inline const char* getCurrentBankName() {
              return BANKS[state().currentBank].name;
          }

          inline void startSequence(const MacroSequence* seq, uint64_t nowUs) {
              if (seq == nullptr || seq->stepCount == 0) {
                  return;
              }
              RuntimeState& s = state();
              s.isPlaying = true;
              s.activeSeq = seq;
              s.stepIndex = 0;
              s.stepStartUs = nowUs;
          }

          inline void process(Gamepad* gamepad) {
              if (gamepad == nullptr) {
                  return;
              }

              RuntimeState& s = state();
              const uint64_t nowUs = time_us_64();
              const uint32_t rawButtons = gamepad->state.buttons;

              const bool selectNow = (rawButtons & BANK_SWITCH_MODIFIER) != 0;
              const bool l1Now     = (rawButtons & COMBO_1_BUTTON) != 0;
              const bool r1Now     = (rawButtons & COMBO_2_BUTTON) != 0;
              const bool startNow  = (rawButtons & GAMEPAD_MASK_S2) != 0;

              const bool selectPressed  = selectNow && !s.prevSelect;
              const bool selectReleased = !selectNow && s.prevSelect;
              const bool l1Pressed      = l1Now && !s.prevL1;
              const bool r1Pressed      = r1Now && !s.prevR1;

              // 1. Select gedrueckt: Bank-Wechsel vorbereiten oder gleichzeitigen Combo-Trigger erkennen
              if (selectPressed) {
                  s.selectConsumed = false;
                  if (startNow) {
                      s.selectConsumed = true;
                  } else if (!s.isPlaying && l1Now) {
                      s.selectConsumed = true;
                      startSequence(&BANKS[s.currentBank].combo1, nowUs);
                  } else if (!s.isPlaying && r1Now) {
                      s.selectConsumed = true;
                      startSequence(&BANKS[s.currentBank].combo2, nowUs);
                  }
              }

              // 2. Waehrend Select gehalten wird: L1/R1 startet Combo und blockiert Bankwechsel
              if (selectNow) {
                  if (startNow) {
                      s.selectConsumed = true;
                  } else if (!s.isPlaying && l1Pressed) {
                      s.selectConsumed = true;
                      startSequence(&BANKS[s.currentBank].combo1, nowUs);
                  } else if (!s.isPlaying && r1Pressed) {
                      s.selectConsumed = true;
                      startSequence(&BANKS[s.currentBank].combo2, nowUs);
                  }
              }

              // 3. On-Release-Logik: Select ohne Combo/Hotkey losgelassen -> naechste Bank
              if (selectReleased && !s.selectConsumed) {
                  s.currentBank = (s.currentBank + 1U) % NUM_BANKS;
              }

              s.prevSelect = selectNow;
              s.prevL1     = l1Now;
              s.prevR1     = r1Now;

              // 4. Trigger-Tasten unterdruecken, damit PS4 Share / L1 / R1 nicht ins Spiel leaken
              if (SUPPRESS_SELECT_OUTPUT) {
                  gamepad->state.buttons &= ~BANK_SWITCH_MODIFIER;
              }
              if (selectNow) {
                  gamepad->state.buttons &= ~(COMBO_1_BUTTON | COMBO_2_BUTTON);
              }

              // 5. Aktives Makro zeitgenau abspielen (exklusiv, damit kein Fehleingang stoert)
              if (s.isPlaying && s.activeSeq != nullptr) {
                  uint64_t elapsedUs = nowUs - s.stepStartUs;

                  while (s.isPlaying) {
                      const MacroStep& step = s.activeSeq->steps[s.stepIndex];
                      const uint64_t totalStepUs =
                          static_cast<uint64_t>(step.durationUs) + static_cast<uint64_t>(step.waitDurationUs);

                      if (elapsedUs >= totalStepUs) {
                          elapsedUs -= totalStepUs;
                          s.stepStartUs += totalStepUs;
                          s.stepIndex++;
                          if (s.stepIndex >= s.activeSeq->stepCount) {
                              s.isPlaying = false;
                              s.activeSeq = nullptr;
                              break;
                          }
                      } else {
                          break;
                      }
                  }

                  if (s.isPlaying && s.activeSeq != nullptr) {
                      const MacroStep& step = s.activeSeq->steps[s.stepIndex];
                      gamepad->state.dpad    = 0;
                      gamepad->state.buttons = 0;

                      if (elapsedUs < step.durationUs) {
                          gamepad->state.buttons = static_cast<uint32_t>(step.buttonMask & 0xFFFFU);
                          gamepad->state.dpad    = static_cast<uint8_t>((step.buttonMask >> 16) & 0x0FU);
                      }
                  }
              }
          }

          } // namespace HardcodedMacros

          #endif // _HARDCODED_MACROS_H_
          """
          write_text(header_path, header_code.lstrip("\n"))
          print(f"[OK] Geschrieben: {header_path}")

          gp2040_cpp = os.path.join("src", "gp2040.cpp")
          if not os.path.isfile(gp2040_cpp):
              print(f"[FEHLER] {gp2040_cpp} nicht gefunden!", file=sys.stderr)
              sys.exit(1)

          src = read_text(gp2040_cpp)
          include_line = '#include "addons/hardcoded_macros.h"'
          if include_line not in src:
              m_inc = re.search(r'(#include\s+"gp2040\.h"\s*\n)', src)
              if m_inc:
                  src = src[:m_inc.end()] + include_line + "\n" + src[m_inc.end():]
              else:
                  src = include_line + "\n" + src
              print("[OK] #include in src/gp2040.cpp eingefuegt.")
          else:
              print("[INFO] #include bereits vorhanden.")

          if "HardcodedMacros::process(" not in src:
              m_hk = re.search(r'^([ \t]*)(\w+)->hotkey\(\);', src, flags=re.MULTILINE)
              if m_hk:
                  indent, var_name = m_hk.group(1), m_hk.group(2)
                  inject = f"\n{indent}HardcodedMacros::process({var_name});"
                  src = src[:m_hk.end()] + inject + src[m_hk.end():]
                  print(f"[OK] HardcodedMacros::process({var_name}) nach hotkey() eingefuegt.")
              else:
                  m_proc = re.search(r'^([ \t]*)(\w+)->process\(\);', src, flags=re.MULTILINE)
                  if not m_proc:
                      print("[FEHLER] Konnte weder hotkey() noch process() in src/gp2040.cpp finden!", file=sys.stderr)
                      sys.exit(1)
                  indent, var_name = m_proc.group(1), m_proc.group(2)
                  inject = f"{indent}HardcodedMacros::process({var_name});\n"
                  src = src[:m_proc.start()] + inject + src[m_proc.start():]
                  print(f"[OK] HardcodedMacros::process({var_name}) vor process() eingefuegt.")
          else:
              print("[INFO] HardcodedMacros::process(...) bereits vorhanden.")

          write_text(gp2040_cpp, src)
          print("=== Alle Patches (Protobuf + C++ + Web-UI + Hardcoded Banks) erfolgreich! ===")

      - name: Node.js einrichten (fuer Web-Configurator)
        if: ${{ inputs.build_webui }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Web-Configurator bauen (www)
        if: ${{ inputs.build_webui }}
        shell: bash
        run: |
          if [ -f "www/package.json" ]; then
            cd www
            npm ci
            npm run build
            ls -la build/ 2>/dev/null || ls -la dist/ 2>/dev/null || true
          else
            echo "::error::www/package.json nicht gefunden!"
            exit 1
          fi

      - name: Firmware mit CMake kompilieren (inkl. Nanopb-Regenerierung & 32-KB-EEPROM-Check)
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DGP2040_BOARDCONFIG="$TARGET_BOARD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_FETCH_FROM_GIT=ON
          cmake --build build -j"$(nproc)"

      - name: Fertige .uf2 Datei sammeln
        shell: bash
        run: |
          mkdir -p release_out
          find build -maxdepth 2 -name "*.uf2" -exec cp -v {} release_out/ \;
          ls -la release_out/

      - name: Firmware-Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-${{ env.TARGET_BOARD }}-8Slots-v3-HardcodedBanks-MK11
          path: release_out/*.uf2
          if-no-files-found: error
