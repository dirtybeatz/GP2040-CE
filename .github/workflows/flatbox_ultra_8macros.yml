name: Build GP2040-CE (8 Macros All-in-One)

on:
  workflow_dispatch:
    inputs:
      board_config:
        description: 'Board-Config Ordner in configs/'
        required: true
        default: 'FlatboxRev4'
      max_macro_inputs:
        description: 'Maximale Input-Zeilen pro Makro (Standard: 24 für 32-KB-EEPROM)'
        required: true
        default: '24'

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      BOARD_CONFIG: ${{ github.event.inputs.board_config || 'FlatboxRev4' }}
      MAX_MACRO_INPUTS: ${{ github.event.inputs.max_macro_inputs || '24' }}
      PICO_SDK_FETCH_FROM_GIT: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            protobuf-compiler \
            python3 \
            python3-pip \
            python3-protobuf
          pip3 install --break-system-packages protobuf grpcio-tools

      - name: Verify board config
        run: |
          if [ ! -d "configs/$BOARD_CONFIG" ]; then
            echo "❌ Board-Config 'configs/$BOARD_CONFIG' nicht gefunden!"
            echo "Verfügbare Boards in configs/:"
            ls -1 configs/
            exit 1
          fi
          echo "✅ Board-Config gefunden: configs/$BOARD_CONFIG"

      - name: Patch 8 macro slots (C++, Protobuf & Web-UI)
        run: |
          cat << 'EOF' > patch_8_macros.mjs
          import fs from 'fs';
          import path from 'path';

          const TARGET_MACROS = 8;
          const TARGET_INPUTS = process.env.MAX_MACRO_INPUTS
            ? Number(process.env.MAX_MACRO_INPUTS)
            : 24;

          function walk(dir, files = []) {
            if (!fs.existsSync(dir)) return files;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (['node_modules', 'dist', 'build', '.git'].includes(entry.name)) continue;
                walk(full, files);
              } else {
                files.push(full);
              }
            }
            return files;
          }

          function patchFile(filePath, replacer, required = false) {
            if (!fs.existsSync(filePath)) {
              if (required) throw new Error(`❌ Pflichtdatei nicht gefunden: ${filePath}`);
              console.warn(`⚠️ Übersprungen (nicht gefunden): ${filePath}`);
              return false;
            }
            const original = fs.readFileSync(filePath, 'utf8');
            const updated = replacer(original);
            if (original !== updated) {
              fs.writeFileSync(filePath, updated, 'utf8');
              console.log(`✅ Gepatcht: ${filePath}`);
              return true;
            }
            if (required) {
              throw new Error(`❌ Patch hat in Pflichtdatei nicht gegriffen: ${filePath}`);
            }
            return false;
          }

          // 1. C++ Makro-Limit und Input-Limit
          patchFile(
            'headers/addons/input_macro.h',
            (content) => {
              let out = content.replace(
                /#define\s+MAX_MACRO_LIMIT\s+\d+/,
                `#define MAX_MACRO_LIMIT ${TARGET_MACROS}`
              );
              if (TARGET_INPUTS && Number.isInteger(TARGET_INPUTS) && TARGET_INPUTS > 0) {
                out = out.replace(
                  /#define\s+MAX_MACRO_INPUT_LIMIT\s+\d+/,
                  `#define MAX_MACRO_INPUT_LIMIT ${TARGET_INPUTS}`
                );
              }
              return out;
            },
            true
          );

          // 2. Protobuf Nanopb max_count (config.options ODER inline in config.proto)
          let patchedProtoLimit = false;

          if (fs.existsSync('proto/config.options')) {
            patchedProtoLimit = patchFile(
              'proto/config.options',
              (content) => {
                let out = content.replace(
                  /(MacroOptions\.macroList\s+max_count\s*:\s*)\d+/,
                  (_, p1) => `${p1}${TARGET_MACROS}`
                );
                if (TARGET_INPUTS && Number.isInteger(TARGET_INPUTS) && TARGET_INPUTS > 0) {
                  out = out.replace(
                    /(Macro\.macroInputs\s+max_count\s*:\s*)\d+/,
                    (_, p1) => `${p1}${TARGET_INPUTS}`
                  );
                }
                return out;
              },
              false
            );
          }

          if (!patchedProtoLimit && fs.existsSync('proto/config.proto')) {
            patchedProtoLimit = patchFile(
              'proto/config.proto',
              (content) => {
                let out = content.replace(
                  /(macroList\s*=\s*\d+\s*\[[^\]]*max_count\s*=\s*)\d+/,
                  (_, p1) => `${p1}${TARGET_MACROS}`
                );
                if (TARGET_INPUTS && Number.isInteger(TARGET_INPUTS) && TARGET_INPUTS > 0) {
                  out = out.replace(
                    /(macroInputs\s*=\s*\d+\s*\[[^\]]*max_count\s*=\s*)\d+/,
                    (_, p1) => `${p1}${TARGET_INPUTS}`
                  );
                }
                return out;
              },
              false
            );
          }

          if (!patchedProtoLimit) {
            throw new Error(
              '❌ Konnte macroList max_count weder in proto/config.options noch in proto/config.proto patchen!'
            );
          }

          // 3. GpioAction Enum erweitern
          let macro7Id = null;
          let macro8Id = null;

          patchFile(
            'proto/enums.proto',
            (content) => {
              const enumMatch = content.match(/enum\s+GpioAction\s*\{([\s\S]*?)\}/);
              if (!enumMatch) throw new Error('❌ enum GpioAction in proto/enums.proto nicht gefunden!');

              const enumBlock = enumMatch[0];
              const enumBody = enumMatch[1];

              if (enumBody.includes('BUTTON_PRESS_MACRO_7')) {
                const m7 = enumBody.match(/BUTTON_PRESS_MACRO_7\s*=\s*(\d+)/);
                const m8 = enumBody.match(/BUTTON_PRESS_MACRO_8\s*=\s*(\d+)/);
                macro7Id = Number(m7[1]);
                macro8Id = Number(m8[1]);
                return content;
              }

              const ids = [...enumBody.matchAll(/=\s*(\d+)\s*(?:\[[^\]]*\]\s*)?;/g)].map((m) =>
                Number(m[1])
              );
              const maxId = Math.max(...ids);
              macro7Id = maxId + 1;
              macro8Id = maxId + 2;

              console.log(`ℹ️ Ermittelte GpioAction IDs -> MACRO_7=${macro7Id}, MACRO_8=${macro8Id}`);

              const updatedBlock = enumBlock.replace(
                /\}\s*$/,
                `    BUTTON_PRESS_MACRO_7 = ${macro7Id};\n    BUTTON_PRESS_MACRO_8 = ${macro8Id};\n}`
              );

              return content.replace(enumBlock, updatedBlock);
            },
            true
          );

          // 4. src/addons/input_macro.cpp sicher erweitern (inkl. Fix für Mask_t{1})
          patchFile(
            'src/addons/input_macro.cpp',
            (content) => {
              if (content.includes('BUTTON_PRESS_MACRO_7')) return content;

              let updated = content.replace(
                /(\bGpioAction\s+\w+\s*)\[\s*6\s*\]/g,
                (_, p1) => `${p1}[${TARGET_MACROS}]`
              );

              // 4a) Fallthrough-Listen (z.B. InputMacro::available())
              updated = updated.replace(
                /(case\s+GpioAction::BUTTON_PRESS_MACRO_5\s*:[ \t]*\r?\n([ \t]*)case\s+GpioAction::BUTTON_PRESS_MACRO_6\s*:)/g,
                (_, full, indent) =>
                  `${full}\n${indent}case GpioAction::BUTTON_PRESS_MACRO_7:\n${indent}case GpioAction::BUTTON_PRESS_MACRO_8:`
              );

              // 4b) Eigenständige case-Blöcke für MACRO_6 (stoppt vor case / default / Zeilenanfang-})
              const dedicatedCaseRegex =
                /([ \t]*case\s+GpioAction::BUTTON_PRESS_MACRO_6\s*:(?!\s*case\s+GpioAction::BUTTON_PRESS_MACRO_7)(?:(?!\b(?:case|default)\b|\r?\n[ \t]*\})[\s\S])*)/g;

              updated = updated.replace(dedicatedCaseRegex, (rawBlock) => {
                const trailingWsMatch = rawBlock.match(/(\s*)$/);
                const trailingWs = trailingWsMatch ? trailingWsMatch[1] : '\n';
                const block = rawBlock.slice(0, rawBlock.length - trailingWs.length);

                const afterColon = block
                  .replace(/^[ \t]*case\s+GpioAction::BUTTON_PRESS_MACRO_6\s*:/, '')
                  .trim();

                if (!afterColon) {
                  const indent = (block.match(/^([ \t]*)/) || ['', ''])[1];
                  return `${block}\n${indent}case GpioAction::BUTTON_PRESS_MACRO_7:\n${indent}case GpioAction::BUTTON_PRESS_MACRO_8:${trailingWs}`;
                }

                const block7 = block
                  .replace(/BUTTON_PRESS_MACRO_6/g, 'BUTTON_PRESS_MACRO_7')
                  .replace(/\[5\]/g, '[6]')
                  .replace(/\(\s*5\s*\)/g, '(6)')
                  .replace(/=\s*5\s*;/g, '= 6;')
                  .replace(/(<<\s*)5\b/g, (_, p1) => `${p1}6`)
                  .replace(/(return\s+)5\s*;/g, (_, p1) => `${p1}6;`);
                const block8 = block
                  .replace(/BUTTON_PRESS_MACRO_6/g, 'BUTTON_PRESS_MACRO_8')
                  .replace(/\[5\]/g, '[7]')
                  .replace(/\(\s*5\s*\)/g, '(7)')
                  .replace(/=\s*5\s*;/g, '= 7;')
                  .replace(/(<<\s*)5\b/g, (_, p1) => `${p1}7`)
                  .replace(/(return\s+)5\s*;/g, (_, p1) => `${p1}7;`);
                return `${block}\n${block7}\n${block8}${trailingWs}`;
              });

              // 4c) Fallback falls kein switch/case vorhanden ist
              if (!updated.includes('BUTTON_PRESS_MACRO_7')) {
                if (/<=\s*GpioAction::BUTTON_PRESS_MACRO_6\b/.test(updated)) {
                  updated = updated.replace(
                    /(<=\s*GpioAction::BUTTON_PRESS_MACRO_)6\b/g,
                    (_, p1) => `${p1}${TARGET_MACROS}`
                  );
                } else {
                  updated = updated.replace(
                    /(GpioAction::BUTTON_PRESS_MACRO_6)/g,
                    '$1,\n        GpioAction::BUTTON_PRESS_MACRO_7,\n        GpioAction::BUTTON_PRESS_MACRO_8'
                  );
                }
              }

              return updated;
            },
            true
          );

          // 5. Weitere C++-Fundstellen (Array-Größen, switch/case, Map-Tabellen, Bereichsprüfungen)
          for (const file of [...walk('src'), ...walk('headers')]) {
            if (file.endsWith('input_macro.cpp') || file.endsWith('input_macro.h')) continue;
            const text = fs.readFileSync(file, 'utf8');
            if (!text.includes('BUTTON_PRESS_MACRO_6')) continue;

            console.log(`🔎 Weiterer Fund in C++ (${file}) – wird analysiert...`);
            const changed = patchFile(file, (content) => {
              if (content.includes('BUTTON_PRESS_MACRO_7') || content.includes('BUTTON_PRESS_MACRO_8')) {
                return content;
              }
              let out = content;

              out = out.replace(
                /(\bGpioAction\s+\w+\s*)\[\s*6\s*\]/g,
                (_, p1) => `${p1}[${TARGET_MACROS}]`
              );

              out = out.replace(
                /([ \t]*case\s+GpioAction::BUTTON_PRESS_MACRO_6\s*:)/g,
                (match) => {
                  const indent = match.match(/^([ \t]*)/)[1];
                  return `${match}\n${indent}case GpioAction::BUTTON_PRESS_MACRO_7:\n${indent}case GpioAction::BUTTON_PRESS_MACRO_8:`;
                }
              );

              out = out.replace(
                /([ \t]*\{\s*GpioAction::BUTTON_PRESS_MACRO_6\s*,\s*([^}\n]*?)\s*\})(,?)/g,
                (_, entry, secondArg, comma) => {
                  const entry7 = entry
                    .replace(/BUTTON_PRESS_MACRO_6/g, 'BUTTON_PRESS_MACRO_7')
                    .replace(secondArg, secondArg.replace(/6/g, '7'));
                  const entry8 = entry
                    .replace(/BUTTON_PRESS_MACRO_6/g, 'BUTTON_PRESS_MACRO_8')
                    .replace(secondArg, secondArg.replace(/6/g, '8'));
                  return `${entry},\n${entry7},\n${entry8}${comma}`;
                }
              );

              out = out.replace(
                /(<=\s*GpioAction::BUTTON_PRESS_MACRO_)6\b/g,
                (_, p1) => `${p1}${TARGET_MACROS}`
              );

              if (!out.includes('BUTTON_PRESS_MACRO_7') && !out.includes('BUTTON_PRESS_MACRO_8')) {
                out = out.replace(
                  /([ \t]*)(GpioAction::BUTTON_PRESS_MACRO_6)(,?)/g,
                  (_, indent, ref, comma) =>
                    `${indent}${ref},\n${indent}GpioAction::BUTTON_PRESS_MACRO_7,\n${indent}GpioAction::BUTTON_PRESS_MACRO_8${comma}`
                );
              }

              return out;
            });

            if (!changed) {
              const lines = text.split('\n');
              lines.forEach((line, idx) => {
                if (line.includes('BUTTON_PRESS_MACRO_6')) {
                  console.warn(`⚠️ Ungepatchte Zeile in ${file}:${idx + 1}: ${line.trim()}`);
                }
              });
            }
          }

          // 6. Web-UI patchen (Locales, TS-Enums, optionale Hardcoded-Limits)
          const webFiles = walk('www/src');
          let patchedMacroLimitCount = 0;
          let patchedGpioActionFiles = 0;

          for (const file of webFiles) {
            if (!/\.(ts|tsx|js|jsx|json)$/.test(file)) continue;
            const original = fs.readFileSync(file, 'utf8');
            let updated = original;

            const isMacroFile =
              /macro/i.test(file) ||
              /MAX_MACRO_|MACRO_LIMIT|macroList|macroInputs/.test(updated);

            if (isMacroFile) {
              const before = updated;
              updated = updated
                .replace(/((?:MAX_MACRO_LIMIT|MAX_MACROS|MACRO_LIMIT)\s*=\s*)\d+/g, (_, p1) => `${p1}${TARGET_MACROS}`)
                .replace(/(macroList\.length\s*<\s*)6\b/g, (_, p1) => `${p1}${TARGET_MACROS}`)
                .replace(/(macroList\.length\s*>=\s*)6\b/g, (_, p1) => `${p1}${TARGET_MACROS}`)
                .replace(/(macroList\.length\s*===?\s*)6\b/g, (_, p1) => `${p1}${TARGET_MACROS}`);

              if (TARGET_INPUTS && Number.isInteger(TARGET_INPUTS) && TARGET_INPUTS > 0) {
                updated = updated
                  .replace(/((?:MAX_MACRO_INPUT_LIMIT|MAX_MACRO_INPUTS|MACRO_INPUT_LIMIT)\s*=\s*)\d+/g, (_, p1) => `${p1}${TARGET_INPUTS}`)
                  .replace(/(macroInputs\.length\s*<\s*)30\b/g, (_, p1) => `${p1}${TARGET_INPUTS}`)
                  .replace(/(macroInputs\.length\s*>=\s*)30\b/g, (_, p1) => `${p1}${TARGET_INPUTS}`)
                  .replace(/(macroInputs\.length\s*===?\s*)30\b/g, (_, p1) => `${p1}${TARGET_INPUTS}`);
              }

              if (updated !== before) patchedMacroLimitCount++;
            }

            if (
              updated.includes('BUTTON_PRESS_MACRO_6') &&
              !updated.includes('BUTTON_PRESS_MACRO_7')
            ) {
              const before = updated;

              if (/BUTTON_PRESS_MACRO_6\s*=\s*\d+/.test(updated)) {
                updated = updated.replace(
                  /([ \t]*)BUTTON_PRESS_MACRO_6(\s*=\s*\d+)(,?)/g,
                  (_, indent, val, comma) =>
                    `${indent}BUTTON_PRESS_MACRO_6${val},\n${indent}BUTTON_PRESS_MACRO_7 = ${macro7Id},\n${indent}BUTTON_PRESS_MACRO_8 = ${macro8Id}${comma}`
                );
              }

              if (updated === before && /BUTTON_PRESS_MACRO_6['"]?\s*:\s*\d+/.test(updated)) {
                updated = updated.replace(
                  /([ \t]*)(['"]?)BUTTON_PRESS_MACRO_6\2(\s*:\s*\d+)(,?)/g,
                  (_, indent, q, val, comma) =>
                    `${indent}${q}BUTTON_PRESS_MACRO_6${q}${val},\n${indent}${q}BUTTON_PRESS_MACRO_7${q}: ${macro7Id},\n${indent}${q}BUTTON_PRESS_MACRO_8${q}: ${macro8Id}${comma}`
                );
              }

              if (/BUTTON_PRESS_MACRO_6['"]?\s*:\s*['"][^'"]+['"]/.test(updated)) {
                updated = updated.replace(
                  /([ \t]*)(['"]?)BUTTON_PRESS_MACRO_6\2(\s*:\s*)(['"])([^'"]*?)6([^'"]*?)\4(,?)/g,
                  (_, indent, kq, colon, vq, prefix, suffix, comma) =>
                    `${indent}${kq}BUTTON_PRESS_MACRO_6${kq}${colon}${vq}${prefix}6${suffix}${vq},\n${indent}${kq}BUTTON_PRESS_MACRO_7${kq}${colon}${vq}${prefix}7${suffix}${vq},\n${indent}${kq}BUTTON_PRESS_MACRO_8${kq}${colon}${vq}${prefix}8${suffix}${vq}${comma}`
                );
              }

              if (
                updated === before &&
                /BUTTON_PRESS_MACRO_6(?![\w'":=])/.test(updated) &&
                !updated.includes('BUTTON_PRESS_MACRO_7')
              ) {
                updated = updated.replace(
                  /([ \t]*)([\w.]*BUTTON_PRESS_MACRO_6)(,?)/g,
                  (_, indent, ref, comma) => {
                    const ref7 = ref.replace('MACRO_6', 'MACRO_7');
                    const ref8 = ref.replace('MACRO_6', 'MACRO_8');
                    return `${indent}${ref},\n${indent}${ref7},\n${indent}${ref8}${comma}`;
                  }
                );
              }

              if (updated !== before) patchedGpioActionFiles++;
            }

            if (updated !== original) {
              fs.writeFileSync(file, updated, 'utf8');
              console.log(`✅ Web-UI gepatcht: ${file}`);
            }
          }

          if (patchedMacroLimitCount === 0) {
            console.log(
              'ℹ️ Kein hartcodiertes 6er-Limit in www/src gefunden – Web-UI übernimmt macroList-Größe dynamisch von der Firmware.'
            );
          } else {
            console.log(`✅ Hartcodierte Web-UI-Makrolimits in ${patchedMacroLimitCount} Datei(en) angepasst.`);
          }

          console.log(
            `🚀 Fertig! 8 Makro-Slots x ${TARGET_INPUTS} Inputs (IDs ${macro7Id} & ${macro8Id}, ${patchedGpioActionFiles} Web-UI GpioAction-Dateien) eingepatcht.`
          );
          EOF
          node patch_8_macros.mjs
          echo "--- Kontrollausgabe input_macro.cpp ---"
          grep -n -C 3 "BUTTON_PRESS_MACRO_6\|BUTTON_PRESS_MACRO_7\|BUTTON_PRESS_MACRO_8" src/addons/input_macro.cpp || true

      - name: Build firmware & Web-UI
        run: |
          cmake -B build -G Ninja -DGP2040_BOARDCONFIG="$BOARD_CONFIG"
          cmake --build build --parallel

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-${{ env.BOARD_CONFIG }}-8Macros-${{ env.MAX_MACRO_INPUTS }}Inputs
          path: build/*.uf2
          if-no-files-found: error
