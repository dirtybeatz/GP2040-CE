name: Build GP2040-CE (8 Macros)

on:
  workflow_dispatch:
    inputs:
      board_config:
        description: 'Board-Ordnername aus configs/ (z.B. FlatboxRev4, FlatboxRev5, FlatboxUltra, Haute42, Pico)'
        required: true
        default: 'FlatboxRev4'
      max_macro_inputs:
        description: 'Optional: MAX_MACRO_INPUT_LIMIT überschreiben (z.B. 20, 22 oder 25; leer = Standard)'
        required: false
        default: '20'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository (with Submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Build Dependencies & ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            protobuf-compiler \
            python3 \
            python3-pip \
            python3-protobuf
          pip3 install --break-system-packages protobuf grpcio-tools

      - name: Verify Board Config
        env:
          BOARD_CONFIG: \${{ inputs.board_config }}
        run: |
          if [ ! -d "configs/\$BOARD_CONFIG" ]; then
            echo "❌ Board-Config 'configs/\$BOARD_CONFIG' nicht gefunden!"
            echo "Verfügbare Boards in configs/:"
            ls -1 configs/
            exit 1
          fi
          echo "✅ Board-Config gefunden: configs/\$BOARD_CONFIG"

      - name: Apply 8-Macro Patch (Firmware + Web UI)
        env:
          MAX_MACRO_INPUTS: \${{ inputs.max_macro_inputs }}
        run: |
          cat << 'EOF' > patch_8_macros.mjs
          import fs from 'fs';
          import path from 'path';

          const TARGET_MACROS = 8;
          const TARGET_INPUTS = process.env.MAX_MACRO_INPUTS
            ? Number(process.env.MAX_MACRO_INPUTS)
            : null;

          function walk(dir, files = []) {
            if (!fs.existsSync(dir)) return files;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (['node_modules', 'dist', 'build', '.git'].includes(entry.name)) continue;
                walk(full, files);
              } else {
                files.push(full);
              }
            }
            return files;
          }

          function patchFile(filePath, replacer, required = false) {
            if (!fs.existsSync(filePath)) {
              if (required) throw new Error(`❌ Pflichtdatei nicht gefunden: ${filePath}`);
              console.warn(`⚠️ Übersprungen (nicht gefunden): ${filePath}`);
              return false;
            }
            const original = fs.readFileSync(filePath, 'utf8');
            const updated = replacer(original);
            if (original !== updated) {
              fs.writeFileSync(filePath, updated, 'utf8');
              console.log(`✅ Gepatcht: ${filePath}`);
              return true;
            }
            if (required) {
              throw new Error(`❌ Patch hat in Pflichtdatei nicht gegriffen: ${filePath}`);
            }
            return false;
          }

          // 1. C++ Makro-Limit (und optional Input-Limit)
          patchFile(
            'headers/addons/input_macro.h',
            (content) => {
              let out = content.replace(
                /#define\s+MAX_MACRO_LIMIT\s+\d+/,
                `#define MAX_MACRO_LIMIT ${TARGET_MACROS}`
              );
              if (TARGET_INPUTS && Number.isInteger(TARGET_INPUTS) && TARGET_INPUTS > 0) {
                out = out.replace(
                  /#define\s+MAX_MACRO_INPUT_LIMIT\s+\d+/,
                  `#define MAX_MACRO_INPUT_LIMIT ${TARGET_INPUTS}`
                );
              }
              return out;
            },
            true
          );

          // 2. Protobuf Nanopb max_count (config.options ODER inline in config.proto)
          let patchedProtoLimit = false;

          if (fs.existsSync('proto/config.options')) {
            patchedProtoLimit = patchFile(
              'proto/config.options',
              (content) => {
                let out = content.replace(
                  /(MacroOptions\.macroList\s+max_count\s*:\s*)\d+/,
                  (_, p1) => `${p1}${TARGET_MACROS}`
                );
                if (TARGET_INPUTS && Number.isInteger(TARGET_INPUTS) && TARGET_INPUTS > 0) {
                  out = out.replace(
                    /(Macro\.macroInputs\s+max_count\s*:\s*)\d+/,
                    (_, p1) => `${p1}${TARGET_INPUTS}`
                  );
                }
                return out;
              },
              false
            );
          }

          if (!patchedProtoLimit && fs.existsSync('proto/config.proto')) {
            patchedProtoLimit = patchFile(
              'proto/config.proto',
              (content) => {
                let out = content.replace(
                  /(macroList\s*=\s*\d+\s*\[[^\]]*max_count\s*=\s*)\d+/,
                  (_, p1) => `${p1}${TARGET_MACROS}`
                );
                if (TARGET_INPUTS && Number.isInteger(TARGET_INPUTS) && TARGET_INPUTS > 0) {
                  out = out.replace(
                    /(macroInputs\s*=\s*\d+\s*\[[^\]]*max_count\s*=\s*)\d+/,
                    (_, p1) => `${p1}${TARGET_INPUTS}`
                  );
                }
                return out;
              },
              false
            );
          }

          if (!patchedProtoLimit) {
            throw new Error(
              '❌ Konnte macroList max_count weder in proto/config.options noch in proto/config.proto patchen!'
            );
          }

          // 3. GpioAction Enum erweitern
          let macro7Id = null;
          let macro8Id = null;

          patchFile(
            'proto/enums.proto',
            (content) => {
              const enumMatch = content.match(/enum\s+GpioAction\s*\{([\s\S]*?)\}/);
              if (!enumMatch) throw new Error('❌ enum GpioAction in proto/enums.proto nicht gefunden!');

              const enumBlock = enumMatch[0];
              const enumBody = enumMatch[1];

              if (enumBody.includes('BUTTON_PRESS_MACRO_7')) {
                const m7 = enumBody.match(/BUTTON_PRESS_MACRO_7\s*=\s*(\d+)/);
                const m8 = enumBody.match(/BUTTON_PRESS_MACRO_8\s*=\s*(\d+)/);
                macro7Id = Number(m7[1]);
                macro8Id = Number(m8[1]);
                return content;
              }

              const ids = [...enumBody.matchAll(/=\s*(\d+)\s*(?:\[[^\]]*\]\s*)?;/g)].map((m) =>
                Number(m[1])
              );
              const maxId = Math.max(...ids);
              macro7Id = maxId + 1;
              macro8Id = maxId + 2;

              console.log(`ℹ️ Ermittelte GpioAction IDs -> MACRO_7=${macro7Id}, MACRO_8=${macro8Id}`);

              const updatedBlock = enumBlock.replace(
                /\}\s*\$/,
                `    BUTTON_PRESS_MACRO_7 = ${macro7Id};\n    BUTTON_PRESS_MACRO_8 = ${macro8Id};\n}`
              );

              return content.replace(enumBlock, updatedBlock);
            },
            true
          );

          // 4. src/addons/input_macro.cpp sicher erweitern (Fallthrough + eigene Case-Blöcke ohne default-Duplizierung)
          patchFile(
            'src/addons/input_macro.cpp',
            (content) => {
              if (content.includes('BUTTON_PRESS_MACRO_7')) return content;

              let updated = content.replace(
                /(\bGpioAction\s+\w+\s*)\[\s*6\s*\]/g,
                (_, p1) => `${p1}[${TARGET_MACROS}]`
              );

              // 4a) Fallthrough-Listen (z.B. in InputMacro::available(): MACRO_5:\n MACRO_6:\n return true;)
              updated = updated.replace(
                /(case\s+GpioAction::BUTTON_PRESS_MACRO_5\s*:[ \t]*\r?\n([ \t]*)case\s+GpioAction::BUTTON_PRESS_MACRO_6\s*:)/g,
                (_, full, indent) =>
                  `${full}\n${indent}case GpioAction::BUTTON_PRESS_MACRO_7:\n${indent}case GpioAction::BUTTON_PRESS_MACRO_8:`
              );

              // 4b) Eigenständige case-Blöcke für MACRO_6 (stoppt strikt vor case / default / })
              const dedicatedCaseRegex =
                /([ \t]*case\s+GpioAction::BUTTON_PRESS_MACRO_6\s*:(?!\s*case\s+GpioAction::BUTTON_PRESS_MACRO_7)(?:(?!\b(?:case|default)\b|\})[\s\S])*)/g;

              updated = updated.replace(dedicatedCaseRegex, (rawBlock) => {
                const trailingWsMatch = rawBlock.match(/(\s*)\$/);
                const trailingWs = trailingWsMatch ? trailingWsMatch[1] : '\n';
                const block = rawBlock.slice(0, rawBlock.length - trailingWs.length);

                const afterColon = block
                  .replace(/^[ \t]*case\s+GpioAction::BUTTON_PRESS_MACRO_6\s*:/, '')
                  .trim();

                if (!afterColon) {
                  const indent = (block.match(/^([ \t]*)/) || ['', ''])[1];
                  return `${block}\n${indent}case GpioAction::BUTTON_PRESS_MACRO_7:\n${indent}case GpioAction::BUTTON_PRESS_MACRO_8:${trailingWs}`;
                }

                const block7 = block
                  .replace(/BUTTON_PRESS_MACRO_6/g, 'BUTTON_PRESS_MACRO_7')
                  .replace(/[5]/g, '[6]')
                  .replace(/\(\s*5\s*\)/g, '(6)')
                  .replace(/=\s*5\s*;/g, '= 6
