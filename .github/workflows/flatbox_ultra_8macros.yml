name: Build GP2040-CE (8 Macros)

on:
  workflow_dispatch:
    inputs:
      board_config:
        description: 'Board-Ordnername aus configs/ (z.B. FlatboxRev4, FlatboxRev5, Haute42COSMOX, Pico)'
        required: true
        default: 'FlatboxRev4'
      max_macro_inputs:
        description: 'Optional: MAX_MACRO_INPUT_LIMIT überschreiben (z.B. 20, 22 oder 25; leer = Standard)'
        required: false
        default: '20'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository (with Submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Build Dependencies & ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            protobuf-compiler \
            python3 \
            python3-pip \
            python3-protobuf
          pip3 install --break-system-packages protobuf grpcio-tools

      - name: Verify Board Config
        env:
          BOARD_CONFIG: \{{ inputs.board_config }}
        run: |
          if [ ! -d "configs/\BOARD_CONFIG" ]; then
            echo "❌ Board-Config 'configs/\BOARD_CONFIG' nicht gefunden!"
            echo "Verfügbare Boards in configs/:"
            ls -1 configs/
            exit 1
          fi
          echo "✅ Board-Config gefunden: configs/\BOARD_CONFIG"

      - name: Apply 8-Macro Patch (Firmware + Web UI)
        env:
          MAX_MACRO_INPUTS: \${{ inputs.max_macro_inputs }}
        run: |
          cat << 'EOF' > patch_8_macros.mjs
          import fs from 'fs';
          import path from 'path';

          const TARGET_MACROS = 8;
          const TARGET_INPUTS = process.env.MAX_MACRO_INPUTS
            ? Number(process.env.MAX_MACRO_INPUTS)
            : null;

          function walk(dir, files = []) {
            if (!fs.existsSync(dir)) return files;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (['node_modules', 'dist', 'build', '.git'].includes(entry.name)) continue;
                walk(full, files);
              } else {
                files.push(full);
              }
            }
            return files;
          }

          function patchFile(filePath, replacer, required = false) {
            if (!fs.existsSync(filePath)) {
              if (required) throw new Error(`❌ Pflichtdatei nicht gefunden: ${filePath}`);
              console.warn(`⚠️ Übersprungen (nicht gefunden): ${filePath}`);
              return false;
            }
            const original = fs.readFileSync(filePath, 'utf8');
            const updated = replacer(original);
            if (original !== updated) {
              fs.writeFileSync(filePath, updated, 'utf8');
              console.log(`✅ Gepatcht: ${filePath}`);
              return true;
            }
            if (required) {
              throw new Error(`❌ Patch hat in Pflichtdatei nicht gegriffen: ${filePath}`);
            }
            return false;
          }

          // 1. C++ Makro-Limit (und optional Input-Limit)
          patchFile(
            'headers/addons/input_macro.h',
            (content) => {
              let out = content.replace(
                /#define\s+MAX_MACRO_LIMIT\s+\d+/,
                `#define MAX_MACRO_LIMIT ${TARGET_MACROS}`
              );
              if (TARGET_INPUTS && Number.isInteger(TARGET_INPUTS) && TARGET_INPUTS > 0) {
                out = out.replace(
                  /#define\s+MAX_MACRO_INPUT_LIMIT\s+\d+/,
                  `#define MAX_MACRO_INPUT_LIMIT ${TARGET_INPUTS}`
                );
              }
              return out;
            },
            true
          );

