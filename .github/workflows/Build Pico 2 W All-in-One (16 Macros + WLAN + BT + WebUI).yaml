name: Build Pico 2 W All-in-One (16 Macros + WLAN + BT + WebUI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pico2w:
    name: Build GP2040-CE for Raspberry Pi Pico 2 W
    runs-on: ubuntu-22.04
    env:
      BUILD_TYPE: Release
      BOARD_CONFIG: Pico2W

    steps:
      - name: Checkout GP2040-CE
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"

      - name: Setup GNU Arm Embedded Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "15.3.Rel1"

      - name: Setup Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Checkout Pico SDK 2.3.1
        uses: actions/checkout@v6.0.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.1
          path: pico-sdk

      - name: Initialize Pico SDK submodules
        working-directory: pico-sdk
        run: git submodule update --init --recursive

      - name: Apply the repository's 16-macro Option A patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          workflow = Path(".github/workflows/gp2040ce_16_macros_optionA_v2.yml").read_text(encoding="utf-8")
          begin = "base64 -d << 'EOF_PATCH_B64'"
          end = "EOF_PATCH_B64"
          if begin not in workflow:
              raise SystemExit("Could not find the embedded Option A patch in the source workflow")
          payload = workflow.split(begin, 1)[1].split(end, 1)[0]
          encoded = "".join(line.strip() for line in payload.splitlines())
          patch = base64.b64decode(encoded, validate=True)
          Path("16_macros_optionA.patch").write_bytes(patch)
          PY
          git apply --check 16_macros_optionA.patch
          git apply --verbose 16_macros_optionA.patch
          grep -q '^#define MAX_MACRO_LIMIT 16$' headers/addons/input_macro.h

      - name: Build WebUI and embedded filesystem
        working-directory: www
        run: |
          npm ci
          CI=false npm run build
          test -s ../lib/httpd/fsdata.c

      - name: Configure CMake for Pico 2 W
        shell: bash
        run: |
          PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
          GP2040_BOARDCONFIG="$BOARD_CONFIG" \
          SKIP_WEBBUILD=TRUE \
          cmake -S . -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE"

      - name: Build firmware
        run: |
          cmake --build build --config "$BUILD_TYPE" --parallel "$(nproc)"

      - name: Verify firmware outputs
        shell: bash
        run: |
          set -euo pipefail
          ls build/GP2040-CE_*_Pico2W.uf2
          ls build/GP2040-CE_*_Pico2W.elf

      - name: Upload Pico 2 W UF2
        uses: actions/upload-artifact@v6.0.0
        with:
          name: GP2040-CE-Pico2W-16Macros
          path: build/GP2040-CE_*_Pico2W.uf2
          if-no-files-found: error

      - name: Upload Pico 2 W ELF
        uses: actions/upload-artifact@v6.0.0
        with:
          name: GP2040-CE-Pico2W-16Macros-ELF
          path: build/GP2040-CE_*_Pico2W.elf
          if-no-files-found: error
