            echo "16_macros_optionA.patch ist bereits im Code aktiv."
          else
            echo "Wende 16_macros_optionA.patch an..."
            git apply --verbose 16_macros_optionA.patch
          fi

          if [ -n "${{ github.event.inputs.extra_patch_file }}" ]; then
            echo "Wende Zusatz-Patch '${{ github.event.inputs.extra_patch_file }}' an..."
            git apply --verbose "${{ github.event.inputs.extra_patch_file }}"
          fi

      - name: Use Node.js 20.x
        uses: actions/setup-node@v6.1.0
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: www/package-lock.json

      - name: Clean install (www)
        working-directory: ${{ github.workspace }}/www
        run: npm ci

      - name: Build WWW (build-proto + vite + makefsdata)
        working-directory: ${{ github.workspace }}/www
        run: CI=false npm run build --if-present

      - name: Upload fsdata.c Artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: fsData
          path: ${{ github.workspace }}/lib/httpd/fsdata.c
          if-no-files-found: error

      - name: Upload 16_macros_optionA.patch Artifact
        if: ${{ github.event.inputs.apply_16_macros_patch != 'false' }}
        uses: actions/upload-artifact@v6.0.0
        with:
          name: patchFile
          path: ${{ github.workspace }}/16_macros_optionA.patch
          if-no-files-found: error

  # ============================================================================
  # 3. C++ Firmware kompilieren (CMake + Pico SDK 2.3.1 -> .uf2)
  # ============================================================================
  build-firmware:
    needs: [build-web, build-config-list]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        GP2040_BOARDCONFIG: ${{ fromJSON(needs.build-config-list.outputs.matrix) }}
    steps:
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"

      - name: Verify CMake
        run: cmake --version

      - name: Checkout GP2040-CE
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download 16_macros_optionA.patch Artifact
        if: ${{ github.event.inputs.apply_16_macros_patch != 'false' }}
        uses: actions/download-artifact@v7.0.0
        with:
          name: patchFile
          path: ${{ github.workspace }}

      - name: Patch auf C++ / Protobuf Quellen anwenden
        if: ${{ github.event.inputs.apply_16_macros_patch != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "MAX_MACRO_LIMIT 16" headers/addons/input_macro.h 2>/dev/null; then
            echo "16_macros_optionA.patch ist bereits im Code aktiv."
          else
            echo "Wende 16_macros_optionA.patch an..."
            git apply --verbose 16_macros_optionA.patch
          fi

          if [ -n "${{ github.event.inputs.extra_patch_file }}" ]; then
            echo "Wende Zusatz-Patch '${{ github.event.inputs.extra_patch_file }}' an..."
            git apply --verbose "${{ github.event.inputs.extra_patch_file }}"
          fi

      - name: Setup GNU Arm Embedded Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '15.3.Rel1'

      - name: Checkout pico-sdk 2.3.1
        uses: actions/checkout@v6.0.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.1
          path: pico-sdk

      - name: Init pico-sdk Submodules
        working-directory: ${{ github.workspace }}/pico-sdk
        run: git submodule update --init

      - name: Download fsdata.c Artifact
        uses: actions/download-artifact@v7.0.0
        with:
          name: fsData
          path: ${{ github.workspace }}/lib/httpd/

      - name: Configure CMake (${{ matrix.GP2040_BOARDCONFIG }})
        shell: bash
        run: |
          PICO_SDK_PATH=${{ github.workspace }}/pico-sdk \
          GP2040_BOARDCONFIG=${{ matrix.GP2040_BOARDCONFIG }} \
          SKIP_WEBBUILD=TRUE \
          cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build Firmware (${{ matrix.GP2040_BOARDCONFIG }})
        shell: bash
        run: |
          GP2040_BOARDCONFIG=${{ matrix.GP2040_BOARDCONFIG }} \
          cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --parallel "$(nproc)"

      - name: Upload .uf2 Artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: GP2040-CE_16Macros_${{ matrix.GP2040_BOARDCONFIG }}
          path: ${{ github.workspace }}/build/GP2040-CE_*_${{ matrix.GP2040_BOARDCONFIG }}.uf2
          if-no-files-found: error

      - name: Upload .elf Artifact
        if: ${{ matrix.GP2040_BOARDCONFIG == 'Pico' || matrix.GP2040_BOARDCONFIG == 'Pico2' }}
        uses: actions/upload-artifact@v6.0.0
        with:
          name: GP2040-CE_16Macros_${{ matrix.GP2040_BOARDCONFIG }}_elf
          path: ${{ github.workspace }}/build/GP2040-CE_*_${{ matrix.GP2040_BOARDCONFIG }}.elf
          if-no-files-found: error
