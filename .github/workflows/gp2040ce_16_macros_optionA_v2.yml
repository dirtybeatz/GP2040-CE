name: GP2040-CE Build (16 Makros Option A + Web-Build)

on:
  workflow_dispatch:
    inputs:
      board_config:
        description: "Board-Konfiguration (Standard: Pico2; leer lassen fuer ALLE Boards)"
        required: false
        default: "Pico2"
        type: choice
        options:
          - Pico2
          - Pico
          - PicoW
          - WaveshareRP2350BPlusW
          - WaveshareZero
          - PimoroniPicoPlus2
          - ARCController
          - ASiLVLABC
          - ASiLVLWASD
          - Blank
          - BentoBox
          - FlatboxRev4
          - FlatboxRev5
          - FlatboxRev5RGB
          - FlatboxRev5USBPassthrough
          - FlatboxRev5Southpaw
          - FlatboxRev8
          - Granola
          - GranolaBeacon
          - AdafruitKB2040
          - KeyboardConverter
          - Haute42COSMOX
          - Haute42COSMOXCAS
          - Haute42COSMOXCAT
          - Haute42COSMOXMLite
          - Haute42COSMOXMUltra
          - Haute42COSMOXXAnalog
          - Liatris
          - MavercadeRev1
          - MavercadeRev2
          - MavercadeRev3
          - MiSTercadeV2
          - OpenCore0
          - OpenCore0MIXUP
          - OpenCore0WASD
          - OSUMGP-RP2040
          - PicoFightingBoard
          - PXPGamepad
          - ReflexCtrlGenesis6
          - ReflexCtrlNES
          - ReflexCtrlSaturn
          - ReflexCtrlSNES
          - ReflexCtrlVB
          - ReflexEncodeV1.2
          - ReflexEncodeV2.0
          - RP2040AdvancedBreakoutBoard
          - RP2040AdvancedBreakoutBoardUSBPassthrough
          - RP2040MiniBreakoutBoard
          - RP2040MiniBreakoutBoardUSBPassthrough
          - SeeedXIAORP2040
          - SparkFunProMicro
          - SparkFunProMicroRP2350
          - SGFDevices
          - ZeroRhythm
          - ""
      apply_16_macros_patch:
        description: "16-Makros-Patch (Option A: 30 Steps, erweitertes EEPROM & 32KB Web-Puffer) anwenden"
        required: false
        default: true
        type: boolean
      extra_patch_file:
        description: "Optionaler Pfad zu einem zusaetzlichen Patch im Repo (z.B. wifi_bl.patch)"
        required: false
        default: ""
        type: string

env:
  BUILD_TYPE: Release

jobs:
  # ============================================================================
  # 1. Board-Matrix bestimmen
  # ============================================================================
  build-config-list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout GP2040-CE
        uses: actions/checkout@v6.0.1

      - name: Board-Matrix generieren
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.board_config }}" ]; then
            printf 'matrix=["%s"]\n' "${{ github.event.inputs.board_config }}" >> "$GITHUB_OUTPUT"
          else
            CONFIG_DIRS=$(ls -d ./configs/*/ | cut -f3 -d'/' | jq -R -s -c 'split("\n")[:-1]')
            echo "matrix=$CONFIG_DIRS" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # 2. Patch anwenden & Web-Configurator bauen (Node.js -> lib/httpd/fsdata.c)
  # ============================================================================
  build-web:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout GP2040-CE
        uses: actions/checkout@v6.0.1

      - name: 16_macros_optionA.patch erstellen & anwenden
        if: ${{ github.event.inputs.apply_16_macros_patch != 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          # Falls im Repo bereits eine eigene 16_macros_optionA.patch liegt, wird diese genutzt.
          # Andernfalls wird der eingebettete Option-A-Patch (13 Dateien, Base64-geschuetzt) entpackt.
