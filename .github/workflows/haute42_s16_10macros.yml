name: Build Haute42 S16 (10 Macros x 25 Inputs + Web-Build)

on:
  workflow_dispatch:
    inputs:
      board_config:
        description: 'GP2040-CE Board Target (Haute42 S16 = Haute42COSMOX)'
        required: true
        default: 'Haute42COSMOX'
      macro_slots:
        description: 'Anzahl Makro-Slots (32 KB Safe = 10)'
        required: true
        default: '10'
      macro_inputs:
        description: 'Max. Input-Zeilen pro Slot (32 KB Safe = 25)'
        required: true
        default: '25'
      pico_sdk_version:
        description: 'Pico SDK Version (GP2040-CE aktuell = 2.3.1)'
        required: true
        default: '2.3.1'
      arm_toolchain_version:
        description: 'Arm GNU Toolchain Version (ab 15.3.rel1 via Arm GitLab)'
        required: true
        default: '15.3.rel1'
  push:
    paths:
      - 'scripts/patch_haute42_s16_10macros.py'
      - '.github/workflows/haute42_s16_10macros.yml'

permissions:
  contents: read

jobs:
  build-haute42-s16:
    name: Build Haute42COSMOX (10x25 + Web-UI)
    runs-on: ubuntu-22.04

    env:
      BOARD_CONFIG: ${{ inputs.board_config || 'Haute42COSMOX' }}
      MACRO_SLOTS: ${{ inputs.macro_slots || '10' }}
      MACRO_INPUTS: ${{ inputs.macro_inputs || '25' }}
      PICO_SDK_VERSION: ${{ inputs.pico_sdk_version || '2.3.1' }}
      ARM_TOOLCHAIN_VERSION: ${{ inputs.arm_toolchain_version || '15.3.rel1' }}

    steps:
      - name: 1. Repository inklusive Submodule auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 2. Node.js 20 für Web-Configurator-Build einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'www/package-lock.json'

      - name: 3. Python 3.11 & Nanopb/Protobuf-Abhängigkeiten installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Build-Tools, Arm GNU Toolchain & Pico SDK einrichten
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl xz-utils pkg-config libusb-1.0-0-dev

          python3 -m pip install --upgrade pip
          python3 -m pip install protobuf grpcio-tools

          # Arm GNU Toolchain herunterladen (ab 15.3.rel1 exklusiv über Arm GitLab)
          TOOLCHAIN_DIR="${{ runner.temp }}/arm-gnu-toolchain"
          mkdir -p "${TOOLCHAIN_DIR}"
          TOOLCHAIN_VER_LOWER="${ARM_TOOLCHAIN_VERSION,,}"
          TOOLCHAIN_ARCHIVE="arm-gnu-toolchain-${TOOLCHAIN_VER_LOWER}-x86_64-arm-none-eabi.tar.xz"
          curl -fSL \
            "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/${TOOLCHAIN_VER_LOWER}/${TOOLCHAIN_ARCHIVE}" \
            -o "${{ runner.temp }}/${TOOLCHAIN_ARCHIVE}"
          tar -xf "${{ runner.temp }}/${TOOLCHAIN_ARCHIVE}" -C "${TOOLCHAIN_DIR}" --strip-components=1
          echo "${TOOLCHAIN_DIR}/bin" >> "$GITHUB_PATH"

          # Pico SDK klonen
          PICO_SDK_DIR="${{ runner.temp }}/pico-sdk"
          git clone --depth 1 --branch "${PICO_SDK_VERSION}" https://github.com/raspberrypi/pico-sdk.git "${PICO_SDK_DIR}"
          git -C "${PICO_SDK_DIR}" submodule update --init --recursive --depth 1
          echo "PICO_SDK_PATH=${PICO_SDK_DIR}" >> "$GITHUB_ENV"

      - name: 5. All-in-One Patch (10 Makro-Slots x 25 Inputs + Webconfig-Puffer) anwenden
        run: |
          python3 scripts/patch_haute42_s16_10macros.py \
            --slots "${MACRO_SLOTS}" \
            --inputs "${MACRO_INPUTS}" \
            --repo .

          echo "=== Git Diff Kurzübersicht ==="
          git status --short

      - name: 6. Kompletten React Web-Build kompilieren (www/)
        working-directory: www
        run: |
          npm ci
          npm run build

      - name: 7. Firmware für Haute42 S16 (Haute42COSMOX, RP2040) kompilieren
        run: |
          set -euo pipefail
          arm-none-eabi-gcc --version
          cmake --version

          cmake -B build -G Ninja \
            -DPICO_BOARD=pico \
            -DPICO_PLATFORM=rp2040 \
            -DGP2040_BOARDCONFIG="${BOARD_CONFIG}" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build --parallel "$(nproc)"

      - name: 8. UF2-Datei & Build-Größe prüfen und verpacken
        run: |
          set -euo pipefail
          mkdir -p dist
          UF2_FILE=$(find build -maxdepth 2 -name "*.uf2" | head -n 1)
          if [ -z "${UF2_FILE}" ]; then
            echo "FEHLER: Keine .uf2 Datei in build/ gefunden!"
            exit 1
          fi

          OUT_NAME="GP2040-CE_${BOARD_CONFIG}_${MACRO_SLOTS}Macros_${MACRO_INPUTS}Inputs_WebUI.uf2"
          cp "${UF2_FILE}" "dist/${OUT_NAME}"

          echo "========================================================"
          echo " Build erfolgreich! (32-KB-EEPROM static_assert bestanden)"
          echo " Datei: dist/${OUT_NAME}"
          ls -lh "dist/${OUT_NAME}"
          echo "========================================================"

          # Patch-Diff als Referenz mit ablegen
          git diff > "dist/applied_changes_${MACRO_SLOTS}x${MACRO_INPUTS}.patch"

      - name: 9. Fertige Firmware als GitHub Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Haute42-S16-${{ inputs.board_config || 'Haute42COSMOX' }}-${{ inputs.macro_slots || '10' }}Macros-${{ inputs.macro_inputs || '25' }}Inputs
          path: dist/
          retention-days: 30
